<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>冬のクローゼット｜鹿煎寺高校</title>
<meta name="description" content="あーすさん・もみじ・凛の冬の私服。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DotGothic16&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#0a0e13;--panel:#121922;--line:#2a3745;--paper:#eef4f1;--dim:#b4c2cc;
  --sig:oklch(0.74 0.18 50);
  --f-display:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-util:"DotGothic16","Zen Kaku Gothic New",monospace;
  --asu:#5b86e5;--momiji:#f08a3c;--rin:#d0485c;--c:var(--sig);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--f-body);overflow-x:hidden}
a{color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);font-family:var(--f-util);font-size:.85rem;letter-spacing:.08em}
.top a{text-decoration:none;color:var(--dim)}.top a:hover{color:var(--paper)}
.top b{margin-left:auto;color:var(--sig);font-weight:400}
header{max-width:1100px;margin:0 auto;padding:22px 16px 0;text-align:center}
header .en{font-family:var(--f-util);color:var(--sig);font-size:.82rem;letter-spacing:.18em}
header h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.8rem,5vw,3rem);margin:.2em 0 .25em;line-height:1.2}
header p{color:var(--dim);line-height:1.8;margin:0 auto;max-width:40em;font-size:1rem}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px auto 0;padding:0 16px}
.filters button{font:inherit;font-size:.95rem;background:transparent;color:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.filters button::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:8px;vertical-align:1px}
.filters button[aria-pressed=true]{background:var(--paper);color:var(--ink);border-color:var(--paper)}

/* 輪 */
.stage{position:relative;height:var(--sh);margin-top:0;perspective:1600px;perspective-origin:50% 38%;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.stage:active{cursor:grabbing}
.stage::before{content:"";position:absolute;left:50%;top:58%;width:min(1200px,120vw);height:60%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,color-mix(in oklab,var(--c) 22%,transparent),transparent);transition:background .6s;pointer-events:none}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(transparent,var(--ink));pointer-events:none}
.ring{position:absolute;left:50%;top:38%;width:0;height:0;transform-style:preserve-3d}
.card{position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw)*9/16);margin:calc(var(--cw)*-9/32) 0 0 calc(var(--cw)/-2);
  border:0;padding:0;background:#fff;border-radius:10px;cursor:pointer;transform-style:preserve-3d;backface-visibility:hidden;
  box-shadow:0 18px 40px rgba(0,0,0,.45)}
.card img{display:block;width:100%;height:100%;object-fit:cover;border-radius:10px;pointer-events:none}
.card::after{content:"";position:absolute;inset:0;border-radius:10px;background:var(--ink);opacity:var(--shade,0);transition:opacity .2s;pointer-events:none}
.card .refl{position:absolute;left:0;right:0;top:100%;height:40%;margin-top:6px;border-radius:10px;overflow:hidden;opacity:.18;transform:scaleY(-1);
  -webkit-mask-image:linear-gradient(to top,#000,transparent 85%);mask-image:linear-gradient(to top,#000,transparent 85%);pointer-events:none}
.card .refl img{height:250%;object-position:bottom}
.card.front{box-shadow:0 24px 60px rgba(0,0,0,.55)}
.card.front::before{content:"";position:absolute;inset:-4px;border:3px solid var(--c);border-radius:13px;pointer-events:none}
.card:focus-visible{outline:3px solid var(--sig);outline-offset:4px}
.arrows{position:absolute;left:0;right:0;top:44%;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none;z-index:5}
.arrows button{pointer-events:auto;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,14,19,.7);color:#fff;font-size:1.3rem;cursor:pointer;transform:translateY(-50%);backdrop-filter:blur(6px)}
.arrows button:hover{background:rgba(255,255,255,.18)}

/* 説明 */
.info{position:relative;max-width:760px;margin:0 auto;padding:0 16px 10px;text-align:center;min-height:170px}
.info .who{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-util);font-size:.9rem;letter-spacing:.12em;color:var(--c)}
.info .who::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.info h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.4rem,3.4vw,2rem);margin:.3em 0 .35em;line-height:1.35}
.info p{color:var(--dim);margin:0 auto .9em;line-height:1.85;font-size:1rem;max-width:34em}
.info button{font:inherit;font-weight:700;font-size:.95rem;background:var(--c);color:#111;border:0;border-radius:999px;padding:11px 26px;cursor:pointer}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
.dots i.on{background:var(--c);transform:scale(1.4)}
.info.swap{animation:swap .45s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 拡大 */
.lb{position:fixed;inset:0;background:rgba(5,8,12,.94);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.lb.on{display:flex}
.lb figure{margin:0;max-width:min(1500px,100%);display:flex;flex-direction:column;gap:10px}
.lb img{max-width:100%;max-height:calc(100vh - 100px);width:auto;height:auto;object-fit:contain;border-radius:8px;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.lb figcaption{color:var(--dim);font-size:.95rem;text-align:center}
.lb .x{position:absolute;top:10px;right:12px;font-size:1.8rem;background:none;border:0;color:var(--paper);cursor:pointer;padding:6px 12px}
.pad{height:40px}
@media (prefers-reduced-motion:reduce){.info.swap{animation:none}}
</style>
</head>
<body>
<nav class="top"><a href="../#character">← 鹿煎寺高校</a><b>WINTER CLOSET</b></nav>
<header>
  <div class="en">= WINTER CLOSET</div>
  <h1>冬のクローゼット</h1>
  <p>あーすさん、もみじ、凛の冬の私服。<br>まわっている服から、気になる1着をえらんでみてください。</p>
</header>
<div class="filters" id="filters"></div>
<div class="stage" id="stage" aria-label="冬服">
  <div class="ring" id="ring"></div>
  <div class="arrows"><button type="button" id="prev" aria-label="前の服">‹</button><button type="button" id="next" aria-label="次の服">›</button></div>
</div>
<section class="info" id="info" aria-live="polite"></section>
<div class="pad"></div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="キャラクターシート">
  <button class="x" id="lbx" aria-label="とじる">×</button>
  <figure><img id="lbimg" alt=""><figcaption id="lbcap"></figcaption></figure>
</div>
<script src="data.js?v=2"></script>
<script>
(()=>{
const WHO={asu:'あーすさん',momiji:'もみじ',rin:'黒瀬 凛'};
const COL={asu:'var(--asu)',momiji:'var(--momiji)',rin:'var(--rin)'};
const root=document.documentElement,stage=document.getElementById('stage'),ring=document.getElementById('ring'),info=document.getElementById('info');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let list=[],cards=[],rot=0,target=null,vel=0,filter='all',dragging=false,moved=false,lastX=0,lastT=0,downX=0,idleT=0,front=-1,G={};
function size(){
  const w=stage.clientWidth,cw=Math.min(w<700?w*0.72:w*0.40,620);
  stage.style.setProperty('--cw',cw+'px');stage.style.setProperty('--sh',(cw*9/16*1.45+30)+'px');
  const n=list.length;const step=360/n;
  // となり同士が少しすき間をあけて並ぶ半径
  const R=Math.max(cw*0.9,(cw*1.08)/(2*Math.tan(Math.PI/n)));
  G={cw,n,step,R};ring.style.transform=`translateZ(${-R}px) rotateX(-2deg)`;
}
function build(){
  ring.innerHTML='';cards=[];
  list=CLOSET.filter(c=>filter==='all'||c.who===filter);
  if(list.length<6)list=list.concat(list); // 少ないときは輪を埋める
  list.forEach((c,i)=>{
    const b=document.createElement('button');b.type='button';b.className='card';b.style.setProperty('--c',COL[c.who]);
    b.setAttribute('aria-label',WHO[c.who]+'「'+c.title+'」');
    b.innerHTML=`<img src="img/${c.id}.jpg?v=3" alt="" loading="${i<4?'eager':'lazy'}" draggable="false"><span class="refl" aria-hidden="true"><img src="img/${c.id}_s.jpg?v=3" alt="" loading="lazy"></span>`;
    b.onclick=()=>{if(moved)return;if(i===front)zoom(c);else goTo(i)};
    ring.appendChild(b);cards.push(b);
  });
  rot=0;target=null;front=-1;size();render();
}
function norm(a){return((a%360)+540)%360-180}
function render(){
  const {step,R}=G;let best=999,bi=0;
  cards.forEach((b,i)=>{
    const a=norm(i*step+rot);const ab=Math.abs(a);
    b.style.transform=`rotateY(${a}deg) translateZ(${R}px)`;
    b.style.visibility=ab>95?'hidden':'visible';
    b.style.setProperty('--shade',Math.min(.7,ab/110).toFixed(3));
    b.style.zIndex=String(1000-Math.round(ab));
    if(ab<best){best=ab;bi=i}
  });
  if(bi!==front){if(front>=0&&cards[front])cards[front].classList.remove('front');front=bi;cards[bi].classList.add('front');showInfo(list[bi])}
}
function showInfo(c){
  root.style.setProperty('--c',COL[c.who]);
  const n=CLOSET.filter(x=>filter==='all'||x.who===filter);const k=n.indexOf(c);
  info.innerHTML=`<div class="who">${WHO[c.who]}　No.${c.no}</div><h2>${c.title}</h2><p>${c.note}</p><button type="button" id="big">シートを大きく見る</button><div class="dots" aria-hidden="true">${n.map((_,j)=>`<i class="${j===k?'on':''}"></i>`).join('')}</div>`;
  document.getElementById('big').onclick=()=>zoom(c);
  info.classList.remove('swap');void info.offsetWidth;info.classList.add('swap');
}
function goTo(i){const d=norm(-i*G.step-rot);target=rot+d;idleT=performance.now()}
function step(dir){goTo((front+dir+cards.length)%cards.length)}
document.getElementById('prev').onclick=e=>{e.stopPropagation();step(-1)};
document.getElementById('next').onclick=e=>{e.stopPropagation();step(1)};
const lb=document.getElementById('lb'),lbimg=document.getElementById('lbimg'),lbcap=document.getElementById('lbcap');
function zoom(c){lbimg.src='img/'+c.id+'.jpg?v=3';lbimg.alt=WHO[c.who]+'の冬服「'+c.title+'」のキャラクターシート';lbcap.textContent=WHO[c.who]+'　'+c.title;lb.classList.add('on');paused=true;document.getElementById('lbx').focus()}
let paused=false;
function unzoom(){lb.classList.remove('on');paused=false;idleT=performance.now()}
document.getElementById('lbx').onclick=unzoom;lb.onclick=e=>{if(e.target===lb)unzoom()};
addEventListener('keydown',e=>{if(e.key==='Escape')unzoom();if(lb.classList.contains('on'))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.arrows'))return;dragging=true;moved=false;downX=lastX=e.clientX;lastT=performance.now();vel=0;target=null});
addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX;if(Math.abs(e.clientX-downX)>6)moved=true;
  const k=G.step/(G.cw*1.05);const now=performance.now();rot+=dx*k;vel=dx*k/Math.max(1,now-lastT)*16;lastX=e.clientX;lastT=now;render()});
addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;idleT=performance.now();
  if(moved){const proj=rot+vel*12;const i=Math.round(-proj/G.step);target=rot+norm(-i*G.step-rot)}setTimeout(()=>moved=false,0)});
stage.addEventListener('mouseenter',()=>hover=true);stage.addEventListener('mouseleave',()=>hover=false);let hover=false;
// フィルター
const fl=document.getElementById('filters');
[['all','みんな','var(--sig)'],['asu','あーすさん',COL.asu],['momiji','もみじ',COL.momiji],['rin','黒瀬 凛',COL.rin]].forEach(([k,l,c])=>{
  const b=document.createElement('button');b.type='button';b.textContent=l;b.style.setProperty('--c',c);b.setAttribute('aria-pressed',k===filter);
  b.onclick=()=>{filter=k;[...fl.children].forEach(x=>x.setAttribute('aria-pressed',x===b));build()};fl.appendChild(b)});
// 動き: 3.2秒ごとに次の服へ（さわっている間とマウスが乗っている間は止まる）
let t0=performance.now();
function tick(t){const dt=Math.min(50,t-t0);t0=t;
  if(!dragging&&target!==null){const d=target-rot;rot+=d*Math.min(1,dt*0.008);if(Math.abs(d)<0.02){rot=target;target=null}render()}
  else if(!dragging&&!paused&&!hover&&!reduce&&t-idleT>3200){idleT=t;step(1)}
  requestAnimationFrame(tick)}
addEventListener('resize',()=>{size();render()});
build();requestAnimationFrame(tick);
})();
</script>
</body>
</html>
